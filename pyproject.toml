[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "veripaper"
version = "0.1.0"
description = "Open-source academic paper tool: idea to publishable, with claim-level verification"
requires-python = ">=3.10"
dependencies = ["requests"]

[project.optional-dependencies]
llm = ["anthropic"]

[tool.setuptools]
# Explicit list: the repo root also holds web/, mobile/ and benchmark/,
# which made setuptools' flat-layout auto-discovery refuse to build.
packages = ["veripaper", "veripaper.verify", "veripaper.data"]

[tool.setuptools.package-data]
"veripaper.data" = ["*.yaml"]
