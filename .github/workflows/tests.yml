name: tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install --quiet -e . pytest
      - run: python -m pytest -q tests
      - run: for f in web/tests/*.js; do node "$f" || exit 1; done
  action-smoke:
    # Runs the published composite action on a 2-entry fixture against the live
    # registries. fail-on none: registry rate limits must not turn CI red; the
    # job checks that the action installs, runs and writes its JSON report.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          files: tests/fixtures/ci-sample.bib
          fail-on: none
          json: veripaper-ci.json
      - run: python -c "import json; d=json.load(open('veripaper-ci.json')); print(d['summary']); assert d['summary']['entries'] == 2"
